<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikum AWS Amplify</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #eef5ff, #f8faff);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    main {
      width: 100%;
      max-width: 760px;
      padding: 48px 32px;
      text-align: center;
      background: #ffffff;
      border: 1px solid #dce6f5;
      border-radius: 20px;
      box-shadow: 0 16px 45px rgba(30, 64, 120, 0.10);
    }
    .label {
      display: inline-block;
      padding: 8px 14px;
      margin-bottom: 18px;
      border-radius: 999px;
      color: #174ea6;
      background: #e8f0fe;
      font-size: 14px;
      font-weight: bold;
    }
    h1 {
      margin: 0 0 16px;
      font-size: clamp(30px, 5vw, 46px);
      line-height: 1.15;
    }
    p {
      margin: 0 auto 24px;
      max-width: 560px;
      color: #536176;
      font-size: 17px;
      line-height: 1.7;
    }
    .status {
      display: inline-block;
      padding: 12px 18px;
      color: #176b3a;
      background: #e8f7ee;
      border-radius: 10px;
      font-weight: bold;
    }
    footer {
      margin-top: 30px;
      color: #7a8799;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="label">Praktikum Cloud Computing</div>
    <h1>Halo, selamat datang!</h1>
    <p>
      Ini adalah halaman website sederhana menggunakan HTML.
      File ini dapat disimpan di repository GitHub dan dihubungkan
      ke AWS Amplify untuk proses deployment.
    </p>
    <div class="status">Website siap untuk deployment</div>
    <footer>Praktikum AWS Amplify · index.html</footer>
  </main>
</body>
</html>
